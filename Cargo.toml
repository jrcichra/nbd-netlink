[package]
name = "nbd-netlink"
version = "0.3.0"
authors = ["Josh Triplett <josh@joshtriplett.org>"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshtriplett/nbd-netlink"
description = "Set up an NBD device for a specified socket and parameters, using the Linux netlink interface"
keywords = ["nbd", "network-block-device", "linux", "netlink", "neli"]
categories = ["api-bindings", "network-programming", "os::unix-apis"]

[dependencies]
anyhow = "1.0.100"
neli = "0.6.5"
neli-proc-macros = "0.1.4"

[dev-dependencies]
async-trait = "0.1"
nbd-async = { git = "https://github.com/oll3/nbd-async.git" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[lints.rust]
non_ascii_idents = "deny"
unfulfilled_lint_expectations = "deny"
unit_bindings = "deny"
unused_qualifications = "deny"

[lints.clippy]
allow_attributes = "deny"
char_lit_as_u8 = "deny"
ignored_unit_patterns = "deny"
implicit_clone = "deny"
manual_is_variant_and = "deny"
manual_let_else = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "allow"
needless_question_mark = "allow"
needless_raw_string_hashes = "deny"
needless_raw_strings = "deny"
non_ascii_literal = "deny"
ptr_as_ptr = "deny"
should_panic_without_expect = "deny"
uninlined_format_args = "deny"
unnecessary_cast = "deny"
