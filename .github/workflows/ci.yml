name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Load nbd kernel module
        run: |
          sudo modprobe nbd nbds_max=8
          ls /dev/nbd0

      - name: cargo build
        run: cargo build --all-targets

      - name: cargo test (netlink connect/reconfigure needs root + CAP_NET_ADMIN)
        run: sudo -E "$(command -v cargo)" test -- --nocapture --test-threads=1

      - name: dmesg (nbd driver messages)
        if: always()
        run: sudo dmesg | grep -i nbd || true
